# CI/CD: проверки кода и сборка, миграции на чистом Postgres, сборка Docker-образа и smoke-тест;
# на пуше в main — публикация образов в GHCR и деплой на сервер (https://tracker.plwedding.ru).
# Run workflow с `tag` — откат: деплой уже опубликованного тега без сборки.
# Подробности — docs/deployment.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образа для отката без сборки (например sha-1a2b3c4). Пусто — собрать и задеплоить текущий коммит main'
        required: false
        default: ''

# PR отменяют устаревшие прогоны; на main прогоны идут по очереди — деплой не прерывается.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  HUSKY: '0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  IMAGE: ghcr.io/leha-creator/tracker
  MIGRATE_IMAGE: ghcr.io/leha-creator/tracker-migrate

jobs:
  check:
    name: Typecheck, lint, tests, build
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # pnpm-store кешируется отдельным шагом ниже.
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check (typecheck, lint, format, tests)
        run: pnpm check

      # Без .env: переменные окружения читаются лениво и на этапе сборки не нужны.
      - name: Build
        run: pnpm build

  migrations:
    name: Migrations on clean Postgres
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasker -d tasker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (prisma migrate deploy)
        run: pnpm db:deploy

      # Код 2 — схема в schema.prisma расходится с применёнными миграциями (забыта миграция).
      - name: Check schema matches migrations (prisma migrate diff)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  docker:
    name: Docker image and smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Теги совпадают с image в compose.app.yml — compose возьмёт собранные образы без пересборки.
      - name: Build runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          tags: tasker:local
          load: true
          push: false
          # Тот же секрет, что в publish: BuildKit не учитывает секреты в ключе кеша, поэтому
          # слой `pnpm build` из этого джоба должен собираться с тем же ключом Server Actions.
          secrets: |
            next_sa_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha,scope=tasker-runner
          cache-to: type=gha,scope=tasker-runner,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          tags: tasker-migrate:local
          load: true
          push: false
          cache-from: |
            type=gha,scope=tasker-runner
            type=gha,scope=tasker-migrate
          cache-to: type=gha,scope=tasker-migrate,mode=max

      # Прод-стек (deploy/tasker) с фиктивными значениями: синтаксис и обязательные переменные.
      - name: Validate production compose
        env:
          DOMAIN: tracker.example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-secret
          S3_BUCKET: tasker-attachments
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789
          TASKER_TAG: ci
        run: docker compose -f deploy/tasker/compose.yml config --quiet

      - name: Start infrastructure, migrations and app
        run: docker compose -f compose.yml -f compose.app.yml up -d --wait --wait-timeout 180 app

      - name: Smoke test /api/health
        run: sh scripts/smoke-health.sh
        env:
          APP_URL: http://localhost:3001

      - name: Dump container logs
        if: failure()
        run: docker compose -f compose.yml -f compose.app.yml logs --no-color migrate app minio-init

      - name: Stop containers
        if: always()
        run: docker compose -f compose.yml -f compose.app.yml down -v

  # Публикация образов в GHCR: только пуш в main (и ручной запуск без tag). Сборка из кеша
  # джоба docker — те же scope и тот же секрет, поэтому слои не пересобираются.
  publish:
    name: Publish images to GHCR
    needs: [check, migrations, docker]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.runner.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Метка source привязывает пакет к репозиторию: GITHUB_TOKEN деплоя может его читать.
      - name: Push runner image
        id: runner
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            next_sa_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha,scope=tasker-runner
          cache-to: type=gha,scope=tasker-runner,mode=max

      - name: Push migrate image
        id: migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          provenance: false
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.MIGRATE_IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tasker-migrate
          cache-to: type=gha,scope=tasker-migrate,mode=max

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUNNER_DIGEST: ${{ steps.runner.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
        run: |
          {
            echo "### Images"
            echo "| image | digest |"
            echo "|---|---|"
            echo "| \`${IMAGE}:${TAG}\` | \`${RUNNER_DIGEST}\` |"
            echo "| \`${MIGRATE_IMAGE}:${TAG}\` | \`${MIGRATE_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Деплой на сервер: после publish или ручной откат (Run workflow с tag) без сборки.
  # Секреты приложения живут на сервере (/opt/tasker/.env); сюда приходят только SSH-доступ
  # и временный GITHUB_TOKEN для docker pull.
  deploy:
    name: Deploy to production
    needs: [publish]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && (needs.publish.result == 'success'
          || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_NAME: ${{ vars.DEPLOY_USER }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      APP_DIR: /opt/tasker
      EDGE_DIR: /opt/edge
      # Секреты стека — из .env, тег релиза — из release.env.
      COMPOSE: docker compose --env-file .env --env-file release.env
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then tag="${INPUT_TAG}"; mode=rollback; else tag="${BUILT_TAG}"; mode=release; fi
          case "${tag}" in
            sha-[0-9a-f]*|main) ;;
            *) echo "::error::invalid tag '${tag}' (expected sha-xxxxxxx or main)"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "deploy mode=${mode} tag=${tag} host=${HOST} domain=${DOMAIN}"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set +x
          if [ -z "${HOST}" ] || [ -z "${USER_NAME}" ] || [ -z "${DOMAIN}" ]; then
            echo "::error::vars DEPLOY_HOST, DEPLOY_USER, DEPLOY_DOMAIN must be set"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n' "${HOST}" "${USER_NAME}" > ~/.ssh/config
          ssh target 'echo "connected to $(hostname) as $(whoami)"'
          ssh target "test -f ${APP_DIR}/.env" || { echo "::error::${APP_DIR}/.env is missing: run infra/host/bootstrap-server.sh, then deploy/bootstrap-app-server.sh"; exit 1; }

      - name: Upload stack files
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # tracker.caddy делает `import access_log`: без сниппета в Caddyfile сайт не пройдёт validate,
          # а уже записанный файл сломает reload остальным проектам. Проверяем до любых изменений.
          ssh target "grep -q '^(access_log)' ${EDGE_DIR}/Caddyfile" || {
            echo "::error::${EDGE_DIR}/Caddyfile has no (access_log) snippet: apply infra/edge first (leha-creator/infra)"; exit 1;
          }
          echo "::group::compose.yml, backup.sh, reminders.sh, cleanup.sh, release.env -> ${APP_DIR}; tracker.caddy -> ${EDGE_DIR}/sites"
          scp deploy/tasker/compose.yml deploy/tasker/backup.sh deploy/tasker/reminders.sh deploy/tasker/cleanup.sh "target:${APP_DIR}/"
          printf 'TASKER_TAG=%s\n' "${TAG}" | ssh target "cat > ${APP_DIR}/release.env"
          # Edge-прокси не видит переменных окружения стека — домен подставляется в файл сайта.
          sed "s/__DOMAIN__/${DOMAIN}/" deploy/tasker/tracker.caddy | ssh target "cat > ${EDGE_DIR}/sites/tracker.caddy"
          ssh target "cat ${APP_DIR}/release.env"
          echo "::endgroup::"

      # Копия БД перед миграциями нового релиза (на первом деплое Postgres ещё нет — пропуск).
      - name: Backup database
        run: ssh target "sh ${APP_DIR}/backup.sh db"

      - name: Pull and start containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set +x
          echo "::group::pull images and start the stack"
          printf '%s' "${GHCR_TOKEN}" | ssh target "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          status=0
          ssh target "cd ${APP_DIR} && ${COMPOSE} pull --quiet && ${COMPOSE} up -d --wait --wait-timeout 180 --remove-orphans app" || status=$?
          ssh target "docker logout ghcr.io" || true
          ssh target "cd ${APP_DIR} && ${COMPOSE} ps -a"
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            # migrate упал -> app не пересоздан, продолжает работать предыдущая версия.
            echo "::error::stack did not become healthy (exit ${status}); if migrate failed, the previous app version keeps running"
            exit "${status}"
          fi

      - name: Reload edge proxy
        run: |
          echo "::group::validate and reload ${EDGE_DIR}"
          ssh target "cd ${EDGE_DIR} && docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile"
          ssh target "cd ${EDGE_DIR} && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile"
          echo "::endgroup::"

      - name: Smoke check
        id: smoke
        env:
          APP_URL: https://${{ vars.DEPLOY_DOMAIN }}
          SMOKE_TIMEOUT: '180'
          SMOKE_INTERVAL: '5'
        run: |
          if sh scripts/smoke-health.sh; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 35/60 — TLS ещё не готов (первый деплой: Caddy выпускает сертификат).
          rc=0
          curl -sS -o /dev/null --max-time 10 "${APP_URL}/api/health" || rc=$?
          if [ "${rc}" -eq 35 ] || [ "${rc}" -eq 60 ]; then
            echo "::warning::TLS is not ready for ${DOMAIN}; Caddy keeps retrying certificate issuance"
            echo "result=tls-not-ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::smoke check failed: ${APP_URL}/api/health"
          exit 1

      # Каждый релиз оставляет на сервере пару образов (~1 ГБ); без очистки диск заполняется,
      # и MinIO отвечает 507 на загрузку файлов. Откат скачивает тег из GHCR заново.
      - name: Prune old images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::group::remove ${IMAGE} and ${MIGRATE_IMAGE} images except ${TAG}"
          ssh target "docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^(${IMAGE}|${MIGRATE_IMAGE}):' \
            | grep -vxF -e '${IMAGE}:${TAG}' -e '${MIGRATE_IMAGE}:${TAG}' \
            | xargs -r docker rmi" || echo "::warning::failed to remove some old images"
          ssh target "docker image prune -f" || true
          usage=$(ssh target "df --output=pcent / | tail -1 | tr -dc 0-9")
          ssh target "df -h /"
          echo "::endgroup::"
          if [ "${usage:-0}" -ge 85 ]; then
            echo "::warning::root disk on ${HOST} is ${usage}% full: file uploads fail with 507 when it runs out"
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          ssh target "cd ${APP_DIR} && ${COMPOSE} ps -a && ${COMPOSE} logs --no-color --tail=100 migrate app minio-init" || true
          ssh target "cd ${EDGE_DIR} && docker compose logs --no-color --tail=50 caddy" || true

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.tag.outputs.mode }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SMOKE: ${{ steps.smoke.outputs.result }}
        run: |
          {
            echo "### Deploy to ${DOMAIN}"
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA::7}\` |"
            echo "| mode | ${MODE:-n/a} |"
            echo "| image | \`${IMAGE}:${TAG:-none}\` |"
            echo "| digest | \`${DIGEST:-n/a}\` |"
            echo "| smoke | ${SMOKE:-failed} |"
          } >> "$GITHUB_STEP_SUMMARY"
