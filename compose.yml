# Локальная инфраструктура для разработки: PostgreSQL + S3-совместимое хранилище (MinIO).
# Приложение запускается на хосте (`pnpm dev`). Переменные берутся из .env (см. .env.example).
#
# Официальные образы MinIO больше не публикуются, поэтому используется сборка MinIO
# из исходников от команды Pigsty (pgsty/minio, pgsty/mc).

name: tasker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasker}
      POSTGRES_DB: ${POSTGRES_DB:-tasker}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tasker}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tasker-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовая инициализация: создаёт приватный бакет и завершается.
  minio-init:
    image: pgsty/mc:latest@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tasker}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tasker-secret}
      S3_BUCKET: ${S3_BUCKET:-tasker-attachments}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET is ready"
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
