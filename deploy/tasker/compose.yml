# Прод-стек Tasker на сервере: MinIO, миграции и приложение. PostgreSQL — общий из
# leha-creator/infra (postgres/; сеть `db`, хост postgres:5432, роль и база tasker).
#
# На сервере лежит в /opt/tasker; копируется workflow деплоя (.github/workflows/ci.yml, джоб deploy).
# Секреты — в /opt/tasker/.env (создаётся один раз, см. .env.example рядом и
# deploy/bootstrap-app-server.sh), тег релиза — в /opt/tasker/release.env (пишет CI):
#
#   cd /opt/tasker
#   docker compose --env-file .env --env-file release.env up -d --wait app
#
# Порты на хост не публикуются: снаружи приложение и путь бакета доступны только через
# общий edge-прокси (leha-creator/infra, edge/; сеть `edge`), файл сайта — tracker.caddy.
name: tasker

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Браузер ходит в бакет через тот же домен (same-origin), CORS — на случай прямых запросов.
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      MINIO_BROWSER: 'off'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m
    logging: *logging
    networks:
      tasker: {}
      # Caddy проксирует сюда только путь бакета /${S3_BUCKET}/*.
      edge:
        aliases: [tasker-minio]

  # Одноразовая инициализация: создаёт приватный бакет и завершается.
  minio-init:
    image: pgsty/mc:latest@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        echo "[minio-init] bucket $$S3_BUCKET is ready"
    restart: 'no'
    logging: *logging
    networks:
      - tasker

  # Разово применяет миграции Prisma и завершается; app стартует только после успеха.
  migrate:
    image: ghcr.io/leha-creator/tracker-migrate:${TASKER_TAG:?TASKER_TAG is required}
    environment:
      DATABASE_URL: postgresql://tasker:${TASKER_DB_PASSWORD:?TASKER_DB_PASSWORD is required}@postgres:5432/tasker?schema=public
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    logging: *logging
    networks:
      - db

  app:
    image: ghcr.io/leha-creator/tracker:${TASKER_TAG:?TASKER_TAG is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://tasker:${TASKER_DB_PASSWORD:?TASKER_DB_PASSWORD is required}@postgres:5432/tasker?schema=public
      S3_ENDPOINT: http://minio:9000
      # Ссылки вложений подписываются на публичный домен: https://<домен>/<бакет>/<ключ>.
      S3_PUBLIC_ENDPOINT: https://${DOMAIN}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENTS_WORKSPACE_QUOTA_MB: ${DOCUMENTS_WORKSPACE_QUOTA_MB:-1024}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: https://${DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      # Пока SMTP не настроен, приложение работает, но письма приглашений не отправляются.
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Tasker <no-reply@tasker.local>}
      # GitHub App (необязательно): пусто — интеграция выключена. Webhook: https://${DOMAIN}/api/webhooks/github
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-Europe/Moscow}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *logging
    networks:
      # tasker — MinIO, db — общий Postgres, edge — входящий трафик через edge-прокси.
      tasker: {}
      db: {}
      edge:
        aliases: [tasker-app]

networks:
  tasker: {}
  # Общая сеть edge-прокси (infra/edge/compose.yml), создаёт infra/host/bootstrap-server.sh.
  edge:
    external: true
    name: edge
  # Общий Postgres (infra/postgres/compose.yml): сеть internal, создаёт infra/host/bootstrap-server.sh.
  # Хост postgres:5432 есть только в ней — своего сервиса postgres в стеке нет, имя не двоится.
  db:
    external: true
    name: db

# Том tasker_postgres-data (свой PG 17 до переезда) compose больше не описывает и не удаляет:
# он хранится неделю после переезда для отката (docs/production.md).
volumes:
  minio-data: {}
