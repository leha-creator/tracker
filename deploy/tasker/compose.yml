# Прод-стек Tasker на сервере: миграции и приложение. Общие сервисы — из leha-creator/infra:
# PostgreSQL (postgres/; сеть `db`, хост postgres:5432, роль и база tasker) и бакет
# tasker-attachments в Yandex Object Storage (storage/; ключ пишет deploy/rotate-storage-key.sh).
#
# На сервере лежит в /opt/tasker; копируется workflow деплоя (.github/workflows/ci.yml, джоб deploy).
# Секреты — в /opt/tasker/.env (создаётся один раз, см. .env.example рядом и
# deploy/bootstrap-app-server.sh), тег релиза — в /opt/tasker/release.env (пишет CI):
#
#   cd /opt/tasker
#   docker compose --env-file .env --env-file release.env up -d --wait app
#
# Порты на хост не публикуются: снаружи приложение доступно только через
# общий edge-прокси (leha-creator/infra, edge/; сеть `edge`), файл сайта — tracker.caddy.
name: tasker

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # Разово применяет миграции Prisma и завершается; app стартует только после успеха.
  migrate:
    image: ghcr.io/leha-creator/tracker-migrate:${TASKER_TAG:?TASKER_TAG is required}
    environment:
      DATABASE_URL: postgresql://tasker:${TASKER_DB_PASSWORD:?TASKER_DB_PASSWORD is required}@postgres:5432/tasker?schema=public
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    logging: *logging
    networks:
      - db

  app:
    image: ghcr.io/leha-creator/tracker:${TASKER_TAG:?TASKER_TAG is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://tasker:${TASKER_DB_PASSWORD:?TASKER_DB_PASSWORD is required}@postgres:5432/tasker?schema=public
      # Yandex Object Storage: сервер и браузер ходят по одному адресу, браузер — по presigned-ссылкам
      # (CORS бакета — только https://<домен>, его задаёт infra).
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DOCUMENTS_WORKSPACE_QUOTA_MB: ${DOCUMENTS_WORKSPACE_QUOTA_MB:-1024}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: https://${DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.plwedding.ru}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-tasker}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      # Пока SMTP не настроен, приложение работает, но письма приглашений не отправляются.
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Tasker <no-reply@tasker.local>}
      # GitHub App (необязательно): пусто — интеграция выключена. Webhook: https://${DOMAIN}/api/webhooks/github
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Связка с meet (необязательно): пусто — выключена. Вебхук: /api/integrations/meet/webhook
      MEET_URL: ${MEET_URL:-}
      MEET_CONTEXT_SECRET: ${MEET_CONTEXT_SECRET:-}
      MEET_WEBHOOK_SECRET: ${MEET_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-Europe/Moscow}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *logging
    networks:
      # db — общий Postgres (internal, без выхода наружу); edge — входящий трафик через
      # edge-прокси и выход в интернет (Object Storage, SMTP, GitHub).
      db: {}
      edge:
        aliases: [tasker-app]

networks:
  # Общая сеть edge-прокси (infra/edge/compose.yml), создаёт infra/host/bootstrap-server.sh.
  edge:
    external: true
    name: edge
  # Общий Postgres (infra/postgres/compose.yml): сеть internal, создаёт infra/host/bootstrap-server.sh.
  # Хост postgres:5432 есть только в ней — своего сервиса postgres в стеке нет, имя не двоится.
  db:
    external: true
    name: db

# Тома tasker_postgres-data (свой PG 17) и tasker_minio-data (MinIO) compose больше не описывает
# и не удаляет: они хранятся неделю после переезда для отката (docs/production.md).
